      // =========================================================================
      // 7. CURRENCY, DATE & TEXT UTILITIES
      // =========================================================================
      function roundCurrency(val, currency) {
        if (currency === 'USD') return Math.round((val + Number.EPSILON) * 100) / 100;
        return Math.round(val);
      }

      function toVnd(amount, currency) {
        if (currency === 'VND') return Math.round(amount);
        const rate = state.fxRates[currency] || 1;
        return Math.round(amount * rate);
      }

      function convertCurrency(amount, fromCurrency, toCurrency) {
        if (fromCurrency === toCurrency) return amount;
        const vnd = toVnd(amount, fromCurrency);
        if (toCurrency === 'VND') return vnd;
        const targetRate = state.fxRates[toCurrency] || 1;
        return vnd / targetRate;
      }

      function formatMoney(amount, currency) {
        if (currency === 'VND') {
          return Math.round(amount).toLocaleString('vi-VN') + ' ₫';
        }
        if (currency === 'USD') {
          return '$' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        if (currency === 'JPY') {
          return '¥' + Math.round(amount).toLocaleString('en-US');
        }
        if (currency === 'CNY') {
          return '¥' + Math.round(amount).toLocaleString('en-US') + ' CNY';
        }
        return String(amount);
      }

      function formatDateDMY(iso) {
        if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
        const [y, m, d] = iso.split('-');
        return `${d}/${m}/${y}`;
      }

      function daysUntilEnd(endIso) {
        if (!endIso) return 99;
        const now = new Date(TODAY_ISO + 'T00:00:00Z');
        const end = new Date(endIso + 'T23:59:59Z');
        return Math.ceil((end - now) / (1000 * 60 * 60 * 24));
      }

      function isDealActive(deal) {
        return daysUntilEnd(deal.promoEnd) >= 0;
      }

      function normalizeSearchText(str) {
        return String(str || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/đ/g, 'd')
          .replace(/Đ/g, 'D')
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // =========================================================================
      // 8. DIRECT STORE URL ROUTER (ZERO 404s) & GOOGLE LIVE VERIFICATION
      // =========================================================================
      function extractCoreProductSearchQuery(name, brand, stripBrandPrefix) {
        let q = String(name || '')
          .replace(/\[[^\]]*\]/g, ' ')
          .replace(/\([^)]*\)/g, ' ')
          .replace(/\b\d+(?:\.\d+)?\s*(?:ml|g|oz|kg|mg|l|qt|cm|mm|inch|pack|packs|count|caps|capsules|tablets|softgels|tabs|sheets|bottles|pc|tv)\b/gi, ' ')
          .replace(/\b(?:spf\s*\d+\+?|pa\+{1,4}|broad\s*spectrum|edition|bundle|cn|jp)\b/gi, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        if (stripBrandPrefix && brand) {
          const escapedBrand = brand.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          q = q.replace(new RegExp('^' + escapedBrand + '\\b', 'i'), '').trim();
        }

        // Keep concise core tokens (brand + 3-4 product tokens) so store search returns exact match
        const words = q.split(/\s+/).filter(Boolean);
        return words.slice(0, stripBrandPrefix ? 4 : 5).join(' ');
      }

      // =========================================================================
      // 9. VERIFIED PROMO CODE ELIGIBILITY ENGINE & AUTO PRICE RECALCULATION
      // =========================================================================
      function extractPromoCodeFromText(text) {
        if (!text) return null;
        const patterns = [
          /(?:code|coupon|promo|mã|use)\s*[:#-]?\s*["']?([A-Z0-9]{4,16})["']?/i,
          /\b(FRIENDS\d+|SAVE\d+|EXTRA\d+|WELCOME\d+|JOMA\d+|CART\d+|FLASH\d+|GOLD\d+|PRO\d+|TMALL\d+|JD\d+|VIP\d+|JOY|20FORYOU)\b/i
        ];
        for (const rx of patterns) {
          const m = String(text).match(rx);
          if (m && m[1] && !/^(FREE|SALE|DEAL|OFF|WITH|ONLY|THIS|THAT|FROM|CODE)$/i.test(m[1])) {
            return m[1].toUpperCase();
          }
        }
        return null;
      }

      function assignVerifiedStorePromoCode(deal) {
        const meta = STORE_META[deal.store] || { currency: 'USD' };
        const currency = deal.currency || meta.currency || 'USD';
        const pool = (STORE_ACTIVE_COUPON_POOL[deal.store] || []).map(p => ({ ...p }));

        // If deal came from community/Gemini with a detected code not already in pool, prepend it
        if (deal.detectedPromoCode && !pool.some(p => p.code === deal.detectedPromoCode)) {
          pool.unshift({
            code: deal.detectedPromoCode,
            discountType: 'percent',
            value: 15,
            minSpend: 0,
            stackable: true,
            eligibleCategories: 'ALL',
            noteVi: `Mã trích xuất trực tiếp từ nguồn săn deal (${deal.detectedPromoCode})`,
            noteEn: `Promo code extracted directly from deal feed (${deal.detectedPromoCode})`
          });
        }

        const baseSale = Number(deal.baseSalePrice || deal.promoPrice || deal.originalPrice);
        const orig = Math.max(Number(deal.originalPrice || baseSale), baseSale);

        const evaluated = pool.map(promo => {
          let isEligible = true;
          let ineligibleReasonVi = '';
          let ineligibleReasonEn = '';

          // Check category eligibility
          if (promo.eligibleCategories !== 'ALL' && Array.isArray(promo.eligibleCategories)) {
            if (!promo.eligibleCategories.includes(deal.category)) {
              isEligible = false;
              ineligibleReasonVi = 'Không áp dụng cho ngành hàng của sản phẩm này';
              ineligibleReasonEn = 'Not eligible for this product category';
            }
          }

          // Check minimum spend eligibility against current store sale price (or MSRP for non-stackable)
          const spendCheckBase = promo.stackable ? baseSale : orig;
          if (isEligible && promo.minSpend > 0 && spendCheckBase < promo.minSpend) {
            isEligible = false;
            ineligibleReasonVi = `Cần đơn tối thiểu ${formatMoney(promo.minSpend, currency)} (SP hiện ở mức ${formatMoney(spendCheckBase, currency)})`;
            ineligibleReasonEn = `Requires min spend ${formatMoney(promo.minSpend, currency)} (item is ${formatMoney(spendCheckBase, currency)})`;
          }

          let priceAfterCode = baseSale;
          let couponSavings = 0;

          if (isEligible) {
            if (promo.discountType === 'percent') {
              if (promo.stackable) {
                const candidate = roundCurrency(baseSale * (1 - promo.value / 100), currency);
                priceAfterCode = candidate;
                couponSavings = roundCurrency(Math.max(0, baseSale - candidate), currency);
              } else {
                // Non-stackable sitewide % off MSRP (e.g., Murad FRIENDS30 = 30% off MSRP)
                const msrpDiscounted = roundCurrency(orig * (1 - promo.value / 100), currency);
                if (msrpDiscounted < baseSale) {
                  priceAfterCode = msrpDiscounted;
                  couponSavings = roundCurrency(baseSale - msrpDiscounted, currency);
                } else {
                  priceAfterCode = baseSale;
                  couponSavings = 0;
                }
              }
            } else if (promo.discountType === 'fixed') {
              const candidate = roundCurrency(Math.max(baseSale * 0.4, baseSale - promo.value), currency);
              priceAfterCode = candidate;
              couponSavings = roundCurrency(Math.max(0, baseSale - candidate), currency);
            }
          }

          const finalDiscountPct = orig > 0 ? Math.round(((orig - priceAfterCode) / orig) * 100) : 0;

          return {
            ...promo,
            isEligible,
            ineligibleReasonVi,
            ineligibleReasonEn,
            priceAfterCode,
            couponSavings,
            finalDiscountPct,
            isOptimal: false
          };
        });

        // Pick best eligible monetary promo (highest total savings / lowest final price), fallback to best perk
        const eligibleMoney = evaluated
          .filter(p => p.isEligible && p.discountType !== 'perk' && p.couponSavings > 0)
          .sort((a, b) => a.priceAfterCode - b.priceAfterCode || b.couponSavings - a.couponSavings);

        const eligibleAny = evaluated.filter(p => p.isEligible);
        const optimal = eligibleMoney[0] || eligibleAny[0] || null;

        if (optimal) {
          optimal.isOptimal = true;
        }

        const finalPrice = optimal ? optimal.priceAfterCode : baseSale;
        const extraSavings = optimal ? optimal.couponSavings : 0;
        const totalDiscountPct = orig > 0 ? Math.max(0, Math.min(95, Math.round(((orig - finalPrice) / orig) * 100))) : 0;

        return {
          ...deal,
          currency,
          originalPrice: orig,
          baseSalePrice: baseSale,
          promoPrice: finalPrice,
          discountPercent: totalDiscountPct,
          extraCouponSavings: extraSavings,
          promoCode: optimal ? optimal.code : '',
          optimalPromo: optimal,
          hasManualCoupon: Boolean(optimal && optimal.discountType !== 'perk' && optimal.isEligible),
          allPromos: evaluated
        };
      }

      // =========================================================================
      // 10. EXPAND COMPACT CATALOG, STRICT DEDUPLICATION & CROSS-STORE MAP
      // =========================================================================
      function buildCoreProductKey(name, brand) {
        const core = extractCoreProductSearchQuery(name, brand, false);
        return normalizeSearchText(core);
      }

      function deduplicateDealsStrict(deals) {
        const seen = new Map();
        const result = [];
        for (const d of deals) {
          const key = `${d.store}|${buildCoreProductKey(d.name, d.brand)}`;
          if (!seen.has(key)) {
            seen.set(key, result.length);
            result.push(d);
          } else {
            // Prefer live/community deal or deeper discount if duplicate on same store
            const idx = seen.get(key);
            const existing = result[idx];
            if (d.dataSource === 'gemini' || (d.dataSource === 'community' && existing.dataSource === 'catalog') || d.discountPercent > existing.discountPercent) {
              result[idx] = d;
            }
          }
        }
        return result;
      }

      function buildCrossStoreMap(deals) {
        const map = {};
        for (const d of deals) {
          const k = buildCoreProductKey(d.name, d.brand);
          if (!map[k]) map[k] = new Set();
          map[k].add(d.store);
        }
        const counts = {};
        for (const [k, set] of Object.entries(map)) {
          counts[k] = set.size;
        }
        return counts;
      }

      function expandCompactCatalogItems() {
        const rawDeals = [];
        let idCounter = 1;

        // 1. Add featured flagship deals first
        for (const item of FEATURED_CROSS_PLATFORM_DEALS) {
          const meta = STORE_META[item.store];
          if (!meta) continue;
          rawDeals.push({
            id: `deal-feat-${idCounter++}`,
            name: item.name,
            brand: item.brand,
            store: item.store,
            market: meta.market,
            channel: meta.channel,
            currency: meta.currency,
            category: item.category,
            originalPrice: item.originalPrice,
            baseSalePrice: item.baseSalePrice,
            sold: item.sold,
            promoStart: item.promoStart,
            promoEnd: item.promoEnd,
            isBlackFriday: item.isBlackFriday !== undefined ? Boolean(item.isBlackFriday) : true,
            dataSource: 'catalog'
          });
        }

        // 2. Expand MASSIVE_REAL_CATALOG_RAW across primary & authentic secondary stores
        MASSIVE_REAL_CATALOG_RAW.forEach((row, idx) => {
          const [name, brand, category, origPrice, discRatio, primaryStore, secondaryStores] = row;
          const stores = [primaryStore, ...(secondaryStores || [])];

          stores.forEach((storeName, sIdx) => {
            const meta = STORE_META[storeName];
            if (!meta) return;

            // Compute authentic slight store-to-store price variance (preserve deep Black Friday 80%-92% deals)
            const variance = ((idx * 7 + sIdx * 13) % 9 - 4) * 0.012;
            const effectiveDisc = Math.max(0.10, Math.min(0.92, discRatio + variance + (storeName === 'IPSY' && discRatio < 0.65 ? 0.22 : 0)));
            const baseSale = roundCurrency(origPrice * (1 - effectiveDisc), meta.currency);
            const win = PROMO_WINDOWS[(idx + sIdx) % PROMO_WINDOWS.length];
            const soldBase = 900 + ((idx * 389 + sIdx * 547) % 14500);

            rawDeals.push({
              id: `deal-cat-${idCounter++}`,
              name,
              brand,
              store: storeName,
              market: meta.market,
              channel: meta.channel,
              currency: meta.currency,
              category,
              originalPrice: origPrice,
              baseSalePrice: baseSale,
              sold: soldBase,
              promoStart: win.start,
              promoEnd: win.end,
              isBlackFriday: effectiveDisc >= 0.35 || win.start >= '2026-11-22',
              dataSource: 'catalog'
            });
          });
        });

        const enriched = rawDeals.map(assignVerifiedStorePromoCode);
        return deduplicateDealsStrict(enriched);
      }

        const key = (state.geminiApiKey || '').trim();

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`;
        let lastErr = null;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const resp = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!resp.ok) {
              const txt = await resp.text();
              throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 120)}`);
            }
            return await resp.json();
          } catch (e) {
            lastErr = e;
            await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
          }
        }
        throw lastErr;

                text: `Search live Black Friday deals today (${TODAY_ISO}) — especially deep 50%-90% off Skincare, Cosmetics & Beauty deals — for "${query}" across reputable US/JP/CN/Global stores (IPSY, Murad, Sephora, Ulta Beauty, Stylevana, YesStyle, Olive Young Global, Nordstrom Rack, Dermstore, Pat McGrath, Tatcha, Soko Glam, Beautylish, GMA Deals, Jomashop, Amazon, Rakuten, Tmall). Return ONLY a valid JSON array (no markdown) of up to 8 objects with keys: name, brand, store, category (one of skincare,beauty,fragrances,health,fashion,footwear,tech,home,baby,sports,luxury), originalPrice (number), baseSalePrice (number), promoCode (string or empty), directLiveUrl (string).`
              }]
            }],
            tools: [{ google_search: {} }]
          };
          const res = await callGeminiWithBackoff(payload);
          const rawText = res?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
          const jsonMatch = rawText.match(/\[[\s\S]*\]/);
          if (jsonMatch) {
            const arr = JSON.parse(jsonMatch[0]);
            const added = arr.filter(x => x && x.name).map((item, i) => {
              const store = STORE_META[item.store] ? item.store : inferStoreFromCommunityText(item.store || item.directLiveUrl || item.name);
              const meta = STORE_META[store] || STORE_META['Amazon US'];
              return assignVerifiedStorePromoCode({
                id: `deal-gem-${Date.now()}-${i}`,
                name: String(item.name),
                brand: String(item.brand || store),
                store,
                market: meta.market,
                channel: meta.channel,
                currency: meta.currency,
                category: CATEGORIES.some(c => c.id === item.category) ? item.category : inferCategoryFromText(item.name),
                originalPrice: Number(item.originalPrice) || Number(item.baseSalePrice) * 1.3 || 60,
                baseSalePrice: Number(item.baseSalePrice) || 45,
                sold: 1200 + i * 310,
                promoStart: TODAY_ISO,
                promoEnd: '2026-12-03',
                dataSource: 'gemini',
                detectedPromoCode: item.promoCode || '',
                directLiveUrl: item.directLiveUrl || ''
              });
            });
            if (added.length > 0) {
              state.deals = deduplicateDealsStrict([...added, ...state.deals]);
              state.crossStoreMap = buildCrossStoreMap(state.deals);
              state.page = 1;
              refreshDealsResultsOnly();
              showToast(`Gemini 3.8 Live đã tìm thấy +${added.length} deal giá thật!`, 'success');
            }
          }
        } catch (err) {
          showToast(`Lỗi Gemini Live: ${err.message}`, 'error');
        } finally {
          state.isScanning = false;
          state.scanStatusText = '';
          renderScanBanner();
        }
      }

      async function runLiveGeminiAuditForDeal(dealId) {
        const deal = state.deals.find(d => d.id === dealId);
        if (!deal) return;
        if (!state.geminiApiKey.trim()) {
          showToast(
            state.lang === 'vi'
              ? 'Cần nhập Gemini API Key trong "⚙️ API & Tỷ giá" để kiểm chứng trực tiếp.'
              : 'Enter Gemini API Key in "⚙️ API & FX" for live verification.',
            'info'
          );
          state.showSettingsModal = true;
          renderModals();
          return;
        }
        state.liveAuditLoading = true;
        state.liveAuditResult = null;
        renderModals();

        try {
          const payload = {
            contents: [{
              parts: [{
                text: `Verify the live promotional price and active promo codes today (${TODAY_ISO}) for "${deal.name}" on "${deal.store}". Respond concisely in ${state.lang === 'vi' ? 'Vietnamese' : 'English'} with 3 bullet points: Current Live Price, Verified Promo Codes, and Buying Advice.`
              }]
            }],
            tools: [{ google_search: {} }]
          };
          const res = await callGeminiWithBackoff(payload);
          const text = res?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n').trim();
          state.liveAuditResult = text || (state.lang === 'vi' ? 'Không có phản hồi chi tiết từ Gemini.' : 'No detailed response returned.');
        } catch (err) {
          state.liveAuditResult = `⚠️ ${err.message}`;
        } finally {
          state.liveAuditLoading = false;
          renderModals();
        }
      }

      // =========================================================================
      // 14. DIRECT PRODUCT URL ANALYZER
      // =========================================================================
      function analyzeProductUrl() {
        const inputEl = document.getElementById('url-analyzer-input');
        const rawUrl = (inputEl ? inputEl.value : state.urlInput || '').trim();
        if (!rawUrl || !/^https?:\/\//i.test(rawUrl)) {
          showToast(
            state.lang === 'vi'
              ? 'Vui lòng dán đường dẫn bắt đầu bằng https:// (VD: https://www.murad.com/products/...)'
              : 'Please paste a valid https:// product URL.',
            'error'
          );
          return;
        }

        try {
          const parsedUrl = new URL(rawUrl);
          const host = parsedUrl.hostname.toLowerCase();
          const store = inferStoreFromCommunityText(host + ' ' + parsedUrl.pathname);
          const meta = STORE_META[store] || STORE_META['Amazon US'];

          const slugParts = parsedUrl.pathname
            .split('/')
            .filter(p => p && !/^(products?|p|dp|shop|item|site|en|us|collections?)$/i.test(p) && !/^[a-z0-9]{10}$/i.test(p));
          const rawSlug = (slugParts[slugParts.length - 1] || 'San pham khuyen mai')
            .replace(/\.html?$/i, '')
            .replace(/[-_]+/g, ' ')
            .trim();
          const niceTitle = rawSlug
            .split(/\s+/)
            .map(w => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');

          // Try to find existing matching deal first
          const normSlug = normalizeSearchText(niceTitle);
          const existing = state.deals.find(d => d.store === store && normalizeSearchText(d.name).includes(normSlug.slice(0, 14)));
          if (existing) {
            existing.directLiveUrl = rawUrl;
            state.selectedDealId = existing.id;
            state.liveAuditResult = null;
            renderModals();
            showToast(state.lang === 'vi' ? `Đã khớp sản phẩm trên ${store}!` : `Matched product on ${store}!`, 'success');
            return;
          }

          const cat = inferCategoryFromText(niceTitle + ' ' + host);
          const defaultOrig = meta.currency === 'JPY' ? 9800 : meta.currency === 'CNY' ? 320 : 85;
          const defaultSale = roundCurrency(defaultOrig * 0.78, meta.currency);

          const newDeal = assignVerifiedStorePromoCode({
            id: `deal-url-${Date.now()}`,
            name: niceTitle.length >= 4 ? niceTitle : `${store} Featured Deal`,
            brand: niceTitle.split(/\s+/)[0] || store,
            store,
            market: meta.market,
            channel: meta.channel,
            currency: meta.currency,
            category: cat,
            originalPrice: defaultOrig,
            baseSalePrice: defaultSale,
            sold: 1250,
            promoStart: TODAY_ISO,
            promoEnd: '2026-12-03',
            dataSource: 'community',
            directLiveUrl: rawUrl
          });

          state.deals = deduplicateDealsStrict([newDeal, ...state.deals]);
          state.crossStoreMap = buildCrossStoreMap(state.deals);
          state.selectedDealId = newDeal.id;
          state.liveAuditResult = null;
          refreshDealsResultsOnly();
          renderModals();
          showToast(state.lang === 'vi' ? `Đã phân tích URL từ ${store} & tính mã tối ưu!` : `Analyzed URL from ${store} & calculated best promo!`, 'success');
        } catch (err) {
          showToast(state.lang === 'vi' ? 'Đường dẫn URL không hợp lệ.' : 'Invalid URL format.', 'error');
        }
      }

      // =========================================================================
      // 15. FILTERING, MULTI-WORD TOKEN SEARCH & SORTING
      // =========================================================================
      function getFilteredDeals() {
        const tokens = normalizeSearchText(state.searchQuery).split(' ').filter(Boolean);

        const filtered = state.deals.filter(deal => {
          if (state.filters.activePromoOnly && !isDealActive(deal)) return false;
          if (state.filters.hasCouponOnly && !deal.hasManualCoupon) return false;
          if (state.filters.blackFridayOnly && !deal.isBlackFriday) return false;
          if (state.filters.dataSource !== 'ALL' && deal.dataSource !== state.filters.dataSource) return false;
          if (state.filters.market !== 'ALL' && deal.market !== state.filters.market) return false;
          if (state.filters.channel !== 'ALL' && deal.channel !== state.filters.channel) return false;
          if (state.filters.store !== 'ALL' && deal.store !== state.filters.store) return false;
          if (state.filters.category !== 'ALL' && deal.category !== state.filters.category) return false;
          if (deal.discountPercent < state.filters.minDiscount) return false;

          if (tokens.length > 0) {
            const catObj = CATEGORIES.find(c => c.id === deal.category);
            const allCodes = (deal.allPromos || []).map(p => p.code).join(' ');
            const haystack = normalizeSearchText([
              deal.name,
              deal.brand,
              deal.store,
              deal.market,
              catObj ? catObj.vi + ' ' + catObj.en : deal.category,
              allCodes
            ].join(' '));
            if (!tokens.every(tok => haystack.includes(tok))) return false;
          }

          return true;
        });

        filtered.sort((a, b) => {
          if (state.sortBy === 'newest') return (b.addedAt || 0) - (a.addedAt || 0) || b.discountPercent - a.discountPercent;
          if (state.sortBy === 'discount') return b.discountPercent - a.discountPercent || b.sold - a.sold;
          if (state.sortBy === 'priceAsc') return toVnd(a.promoPrice, a.currency) - toVnd(b.promoPrice, b.currency);
          if (state.sortBy === 'priceDesc') return toVnd(b.promoPrice, b.currency) - toVnd(a.promoPrice, a.currency);
          if (state.sortBy === 'sold') return b.sold - a.sold;
          if (state.sortBy === 'ending') return daysUntilEnd(a.promoEnd) - daysUntilEnd(b.promoEnd);
          return 0;
        });

        return filtered;
      }

      function renderPaginationHtml(totalPages) {
        if (totalPages <= 1) return '';
        const pages = [];
        const start = Math.max(1, state.page - 2);
        const end = Math.min(totalPages, state.page + 2);
        for (let p = start; p <= end; p++) pages.push(p);

        return `
          <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
            <div class="text-xs text-slate-500 dark:text-slate-400">
              ${state.lang === 'vi' ? 'Trang' : 'Page'} <strong class="text-slate-900 dark:text-white">${state.page}</strong> / ${totalPages}
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="setPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}
                class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold disabled:opacity-40 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                ${t('pagePrev')}
              </button>
              ${pages.map(p => `
                <button type="button" onclick="setPage(${p})"
                  class="w-8 h-8 rounded-xl text-xs font-bold border transition ${
                    p === state.page
                      ? 'bg-indigo-600 text-white border-indigo-600'
                      : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800'
                  }">${p}</button>
              `).join('')}
              <button type="button" onclick="setPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}
                class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold disabled:opacity-40 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                ${t('pageNext')}
              </button>
            </div>
          </div>
        `;
      }

          html += `

                </div>
                <button type="button" onclick="toggleMobileFilters(true)"
                  class="lg:hidden px-2.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 text-xs font-bold shrink-0">
                  ${t('filtersBtn')}
                </button>
              </div>

              <!-- Controls -->
              <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 min-w-0">
                <!-- Search Mode Toggle -->
                <div class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-0.5 border border-slate-200 dark:border-slate-700">
                  <button type="button" onclick="setSearchMode('free')"
                    class="px-2 py-1 rounded-lg text-[11px] font-bold transition ${state.searchMode === 'free' ? 'bg-white dark:bg-slate-700 text-emerald-700 dark:text-emerald-300 shadow-xs' : 'text-slate-500 dark:text-slate-400'}">
                    ${t('freeMode')}
                  </button>
                  <button type="button" onclick="setSearchMode('gemini')"
                    class="px-2 py-1 rounded-lg text-[11px] font-bold transition ${state.searchMode === 'gemini' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-500 dark:text-slate-400'}">
                    ✨ ${t('geminiMode')}
                  </button>
                </div>

                <!-- Reference Currency -->
                <select onchange="setRefCurrency(this.value)" aria-label="Reference currency"
                  class="px-2 py-1 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200">
                  ${['VND', 'USD', 'JPY', 'CNY'].map(c => `<option value="${c}" ${state.refCurrency === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>

                <!-- VI / EN Toggle -->
                <button type="button" onclick="setLanguage('${state.lang === 'vi' ? 'en' : 'vi'}')"
                  class="px-2 py-1 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
                  ${state.lang === 'vi' ? 'VI' : 'EN'}
                </button>

                <!-- Light / Dark Theme Toggle -->
                <button type="button" onclick="toggleThemeMode()" title="Light / Dark Mode"
                  class="px-2 py-1 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
                  ${state.theme === 'light' ? '🌙' : '☀️'}
                </button>

                <button type="button" onclick="exportDealsToCsv()"
                  class="hidden sm:inline-flex items-center px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
                  📥 ${t('exportCsv')}
                </button>
                <button type="button" onclick="openEmbedModal()"
                  class="hidden md:inline-flex items-center px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
                  🌐 ${t('googleSites')}
                </button>
                <button type="button" onclick="openSettingsModal()"
                  class="px-2.5 py-1.5 rounded-xl bg-slate-900 dark:bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition">
                  ⚙️ ${t('apiSettings')}
                </button>
              </div>
            </div>
          </header>

          <!-- Main Content -->
          <main class="max-w-[1440px] w-full mx-auto px-3 sm:px-5 py-4 sm:py-5 flex-1 space-y-4 overflow-x-hidden">
            <!-- Search, URL Analyzer & Community Harvesting Panel (Never re-rendered on keystroke) -->
            <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 shadow-sm space-y-3 w-full min-w-0 overflow-hidden">
              <div class="flex flex-col md:flex-row gap-2.5 min-w-0">
                <div class="relative flex-1 min-w-0">
                  <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                  <input
                    id="main-search-input"
                    type="text"
                    autocomplete="off"
                    value="${escapeHtml(state.searchQuery)}"
                    placeholder="${escapeHtml(t('searchPlaceholder'))}"
                    class="w-full min-w-0 pl-10 pr-9 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button type="button" id="clear-search-btn" onclick="clearSearchInput()"
                    class="${state.searchQuery ? '' : 'hidden'} absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 dark:hover:text-white text-xs font-bold">
                    ✕
                  </button>
                </div>
                <div class="flex flex-wrap gap-2 min-w-0">
                  <button type="button" onclick="triggerPrimarySearch()"
                    class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold shadow-xs transition">
                    ${state.searchMode === 'gemini' ? '✨ Gemini Live' : t('searchBtn')}
                  </button>
                  <button type="button" id="quick-bf-btn" onclick="toggleQuickBlackFriday()"
                    class="flex-1 sm:flex-none px-3.5 py-2.5 rounded-xl ${state.filters.blackFridayOnly ? 'bg-slate-900 text-amber-300 border-slate-900 dark:bg-amber-400 dark:text-slate-950' : 'bg-amber-50 text-amber-900 border-amber-300 dark:bg-amber-950/50 dark:text-amber-200 dark:border-amber-700'} border text-xs font-extrabold transition">
                    🖤 Black Friday (36 ${state.lang === 'vi' ? 'sàn' : 'stores'})
                  </button>
                  <button type="button" onclick="openGoogleSearchFromBar()"
                    class="w-full sm:w-auto px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-semibold transition">
                    ${t('liveGoogleBtn')}
                  </button>
                </div>
              </div>

              <!-- URL Analyzer & Free $0 Community Harvesting Row -->
              <div class="flex flex-col lg:flex-row items-stretch lg:items-center gap-2.5 pt-2 border-t border-slate-100 dark:border-slate-800 min-w-0">
                <div class="flex flex-col sm:flex-row flex-1 gap-2 min-w-0">
                  <input
                    id="url-analyzer-input"
                    type="url"
                    value="${escapeHtml(state.urlInput)}"
                    placeholder="${escapeHtml(t('urlPlaceholder'))}"
                    class="w-full min-w-0 flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button type="button" onclick="analyzeProductUrl()"
                    class="w-full sm:w-auto px-3.5 py-2 rounded-xl bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-bold transition shrink-0">
                    🔗 ${t('analyzeUrlBtn')}
                  </button>
                </div>
                <div class="flex flex-wrap gap-2 min-w-0">
                  <button type="button" onclick="runFreeCommunitySearch(false)"
                    class="flex-1 sm:flex-none px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 text-xs font-bold transition">
                    ⚡ ${t('scanCommunityBtn')}
                  </button>
                  <button type="button" onclick="runFreeCommunitySearch(true)"
                    class="flex-1 sm:flex-none px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 text-xs font-bold transition">
                    🔥 ${t('huntMassiveBtn')}
                  </button>
                </div>
              </div>

              <div id="scan-status-banner"></div>
            </section>

            <!-- Workspace: Desktop Sticky Left Sidebar + Right KPI & Results -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start w-full min-w-0">
              <aside id="desktop-sidebar-host" class="hidden lg:block lg:col-span-3 sticky top-20 min-w-0">
                ${renderFiltersSidebar()}
              </aside>
              <section id="deals-results-area" class="lg:col-span-9 space-y-4 min-w-0 w-full"></section>
            </div>
          </main>

          <footer class="border-t border-slate-200 dark:border-slate-800 py-5 pb-20 sm:pb-6 px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            GlobalDeal AI · US · JP · CN Cross-Border Deal Intelligence · <span id="footer-deals-count">${state.deals.length}</span> ${state.lang === 'vi' ? 'sản phẩm đối chiếu đa sàn' : 'deduplicated cross-store deals'}
          </footer>

          <div id="modals-root"></div>
        `;

        // Bind IME-safe event listeners on #main-search-input
        const searchEl = document.getElementById('main-search-input');
        if (searchEl) {
          searchEl.addEventListener('compositionstart', () => {
            state.isComposing = true;
          });
          searchEl.addEventListener('compositionend', (e) => {
            state.isComposing = false;
            state.searchQuery = e.target.value;
            state.page = 1;
            const clr = document.getElementById('clear-search-btn');
            if (clr) clr.classList.toggle('hidden', !state.searchQuery);
            refreshDealsResultsOnly();
          });
          searchEl.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            const clr = document.getElementById('clear-search-btn');
            if (clr) clr.classList.toggle('hidden', !state.searchQuery);
            if (!state.isComposing) {
              state.page = 1;
              refreshDealsResultsOnly();
            }
          });
          searchEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !state.isComposing) {
              e.preventDefault();
              triggerPrimarySearch();
            }
          });
        }

        const urlEl = document.getElementById('url-analyzer-input');
        if (urlEl) {
          urlEl.addEventListener('input', (e) => {
            state.urlInput = e.target.value;
          });
          urlEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              analyzeProductUrl();
            }
          });
        }

        refreshDealsResultsOnly();
        renderScanBanner();
        renderModals();
      }

      // =========================================================================
      // 19. GLOBAL INTERACTION HANDLERS
      // =========================================================================
      window.scrollToPageTop = function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      window.scrollToPageBottom = function () {
        const footer = document.querySelector('#app > footer');
        const appEl = document.getElementById('app');
        const viewportH = window.innerHeight || document.documentElement.clientHeight || 0;
        const maxDocScroll = Math.max(0, document.documentElement.scrollHeight - viewportH);

        let targetTop = maxDocScroll;
        if (footer) {
          const footerBottom = footer.getBoundingClientRect().bottom + window.scrollY;
          targetTop = Math.max(0, Math.round(footerBottom - viewportH));
        } else if (appEl) {
          const appBottom = appEl.getBoundingClientRect().bottom + window.scrollY;
          targetTop = Math.max(0, Math.round(appBottom - viewportH));
        }

        window.scrollTo({
          top: Math.min(targetTop, maxDocScroll),
          behavior: 'smooth'
        });
      };

      window.toggleThemeMode = function () {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        persistSettings();
        renderAppShell();
      };

      window.setLanguage = function (lang) {
        state.lang = lang === 'en' ? 'en' : 'vi';
        persistSettings();
        renderAppShell();
      };

      window.setRefCurrency = function (curr) {
        state.refCurrency = curr;
        persistSettings();
        refreshDealsResultsOnly();
        renderModals();
      };

      window.setSearchMode = function (mode) {
        state.searchMode = mode === 'gemini' ? 'gemini' : 'free';
        persistSettings();
        renderAppShell();
      };

      window.toggleMobileFilters = function (open) {
        state.mobileFiltersOpen = Boolean(open);
        renderModals();
      };

      window.setFilter = function (key, val) {
        state.filters[key] = val;
        state.page = 1;
        const desktopSidebar = document.getElementById('desktop-sidebar-host');
        if (desktopSidebar) desktopSidebar.innerHTML = renderFiltersSidebar();
        const bfBtn = document.getElementById('quick-bf-btn');
        if (bfBtn) {
          bfBtn.className = `flex-1 sm:flex-none px-3.5 py-2.5 rounded-xl ${state.filters.blackFridayOnly ? 'bg-slate-900 text-amber-300 border-slate-900 dark:bg-amber-400 dark:text-slate-950' : 'bg-amber-50 text-amber-900 border-amber-300 dark:bg-amber-950/50 dark:text-amber-200 dark:border-amber-700'} border text-xs font-extrabold transition`;
        }
        refreshDealsResultsOnly();
        if (state.mobileFiltersOpen) renderModals();
      };

      window.toggleQuickBlackFriday = function () {
        window.setFilter('blackFridayOnly', !state.filters.blackFridayOnly);
      };

      window.resetAllFilters = function () {
        state.filters = {
          activePromoOnly: true,
          hasCouponOnly: false,
          blackFridayOnly: false,
          dataSource: 'ALL',
          market: 'ALL',
          channel: 'ALL',
          store: 'ALL',
          category: 'ALL',
          minDiscount: 0
        };
        state.searchQuery = '';
        state.page = 1;
        const searchEl = document.getElementById('main-search-input');
        if (searchEl) searchEl.value = '';
        const clr = document.getElementById('clear-search-btn');
        if (clr) clr.classList.add('hidden');
        const desktopSidebar = document.getElementById('desktop-sidebar-host');
        if (desktopSidebar) desktopSidebar.innerHTML = renderFiltersSidebar();
        const bfBtn = document.getElementById('quick-bf-btn');
        if (bfBtn) {
          bfBtn.className = 'flex-1 sm:flex-none px-3.5 py-2.5 rounded-xl bg-amber-50 text-amber-900 border-amber-300 dark:bg-amber-950/50 dark:text-amber-200 dark:border-amber-700 border text-xs font-extrabold transition';
        }
        refreshDealsResultsOnly();
        if (state.mobileFiltersOpen) renderModals();
      };

      window.toggleDataSourceFilter = function (source) {
        const nextSource = (source === 'ALL' || state.filters.dataSource === source) ? 'ALL' : source;
        state.filters.dataSource = nextSource;
        state.page = 1;
        refreshDealsResultsOnly();
        if (nextSource === 'ALL') {
          showToast(state.lang === 'vi' ? 'Đã hiển thị lại tất cả nguồn dữ liệu.' : 'Showing all data sources.', 'info');
        } else {
          const label = nextSource === 'catalog' ? t('srcCatalog') : nextSource === 'community' ? t('srcCommunity') : t('srcGemini');
          showToast(state.lang === 'vi' ? `Đang lọc theo nguồn: ${label}` : `Filtering by: ${label}`, 'info');
        }
      };

      window.openCrossStoreCompare = function (dealId) {
        const deal = state.deals.find(d => d.id === dealId);
        if (!deal) return;
        state.compareProductKey = buildCoreProductKey(deal.name, deal.brand);
        state.compareProductTitle = deal.name;
        renderModals();
      };

      window.closeCrossStoreCompare = function () {
        state.compareProductKey = null;
        state.compareProductTitle = '';
        renderModals();
      };

      window.filterByComparedProduct = function () {
        const query = state.compareProductKey || '';
        state.compareProductKey = null;
        state.compareProductTitle = '';
        if (query) {
          state.searchQuery = query;
          state.page = 1;
          const searchEl = document.getElementById('main-search-input');
          if (searchEl) searchEl.value = query;
          const clr = document.getElementById('clear-search-btn');
          if (clr) clr.classList.remove('hidden');
        }
        renderModals();
        refreshDealsResultsOnly();
      };

      window.clearSearchInput = function () {
        state.searchQuery = '';
        state.page = 1;
        const searchEl = document.getElementById('main-search-input');
        if (searchEl) {
          searchEl.value = '';
          searchEl.focus();
        }
        const clr = document.getElementById('clear-search-btn');
        if (clr) clr.classList.add('hidden');
        refreshDealsResultsOnly();
      };

      window.triggerPrimarySearch = function () {
        if (state.searchMode === 'gemini') {
          runGeminiLiveSearch();
        } else {
          state.page = 1;
          refreshDealsResultsOnly();
        }
      };

      window.openGoogleSearchFromBar = function () {
        const q = (state.searchQuery || '').trim() || 'Murad Rapid Dark Spot deal';
        window.open(`https://www.google.com/search?q=${encodeURIComponent(q + ' sale deal')}`, '_blank', 'noopener,noreferrer');
      };

      window.setViewMode = function (mode) {
        state.viewMode = mode === 'table' ? 'table' : 'grid';
        refreshDealsResultsOnly();
      };

      window.setSortBy = function (sortBy) {
        state.sortBy = sortBy;
        state.page = 1;
        refreshDealsResultsOnly();
      };

      window.setPageSize = function (size) {
        state.pageSize = size || 12;
        state.page = 1;
        refreshDealsResultsOnly();
      };

      window.setPage = function (p) {
        state.page = Math.max(1, p);
        refreshDealsResultsOnly();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      window.copyPromoCode = function (code) {
        copyTextSafe(code, state.lang === 'vi' ? `Đã sao chép mã giảm giá: ${code}` : `Copied promo code: ${code}`);
      };

      window.copyCodeAndGo = function (code, url) {
        copyTextSafe(code, state.lang === 'vi' ? `Đã sao chép mã ${code} — đang mở nơi bán...` : `Copied ${code} — opening store...`);
        window.open(url, '_blank', 'noopener,noreferrer');
      };

      window.openAiDrawer = function (dealId) {
        state.selectedDealId = dealId;
        state.liveAuditLoading = false;
        state.liveAuditResult = null;
        renderModals();
      };

      window.closeAiDrawer = function () {
        state.selectedDealId = null;
        renderModals();
      };

      window.openSettingsModal = function () {
        state.showSettingsModal = true;
        renderModals();
      };

      window.closeSettingsModal = function () {
        state.showSettingsModal = false;
        renderModals();
      };

      window.saveSettingsFromModal = function () {
        const keyEl = document.getElementById('modal-gemini-key');
        const thinkEl = document.getElementById('modal-thinking-level');
        const usdEl = document.getElementById('modal-fx-usd');
        const jpyEl = document.getElementById('modal-fx-jpy');
        const cnyEl = document.getElementById('modal-fx-cny');

        if (keyEl) state.geminiApiKey = keyEl.value.trim();
        if (thinkEl) state.thinkingLevel = thinkEl.value;
        if (usdEl && Number(usdEl.value) > 0) state.fxRates.USD = Number(usdEl.value);
        if (jpyEl && Number(jpyEl.value) > 0) state.fxRates.JPY = Number(jpyEl.value);
        if (cnyEl && Number(cnyEl.value) > 0) state.fxRates.CNY = Number(cnyEl.value);

        persistSettings();
        state.showSettingsModal = false;
        renderModals();
        refreshDealsResultsOnly();
        showToast(state.lang === 'vi' ? 'Đã lưu cài đặt API & Tỷ giá!' : 'Saved API & FX settings!', 'success');
      };

      window.openEmbedModal = function () {
        state.showEmbedModal = true;
        renderModals();
      };

      window.closeEmbedModal = function () {
        state.showEmbedModal = false;
        renderModals();
      };

      window.copyGoogleSitesSnippet = function () {
        const el = document.getElementById('google-sites-snippet');
        if (el) {
          copyTextSafe(el.value, state.lang === 'vi' ? 'Đã sao chép mã nhúng Google Sites!' : 'Copied Google Sites embed code!');
        }
      };

      window.exportDealsToCsv = function () {
        try {
          const deals = getFilteredDeals();
          const header = ['Name', 'Brand', 'Store', 'Market', 'Category', 'Currency', 'OriginalPrice', 'StoreSalePrice', 'FinalPriceAfterCode', 'Discount%', 'OptimalPromoCode', 'PromoStart', 'PromoEnd', 'DirectURL'];
          const rows = deals.map(d => [
            d.name, d.brand, d.store, d.market, d.category, d.currency,
            d.originalPrice, d.baseSalePrice, d.promoPrice, d.discountPercent + '%',
            d.promoCode || '', d.promoStart, d.promoEnd, buildStoreDirectProductUrl(d)
          ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','));

          const csv = '\uFEFF' + [header.join(','), ...rows].join('\n');
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `GlobalDeal_AI_${TODAY_ISO}.csv`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(state.lang === 'vi' ? `Đã xuất ${deals.length} deal ra file CSV!` : `Exported ${deals.length} deals to CSV!`, 'success');
        } catch (err) {
          showToast('Lỗi khi xuất CSV.', 'error');
        }
      };

      window.runFreeCommunitySearch = runFreeCommunitySearch;
      window.analyzeProductUrl = analyzeProductUrl;
      window.runLiveGeminiAuditForDeal = runLiveGeminiAuditForDeal;

      // =========================================================================
      // 20. BOOTSTRAP INITIALIZATION (SAFE & INSTANT ON MOBILE/DESKTOP)
      // =========================================================================
      function bootstrap() {
        try {
          state.deals = expandCompactCatalogItems();
          state.crossStoreMap = buildCrossStoreMap(state.deals);
          renderAppShell();
        } catch (err) {
          const root = document.getElementById('app');
          if (root) {
            root.innerHTML = `<div class="p-6 max-w-md mx-auto text-center text-rose-600 font-semibold">Lỗi khởi tạo ứng dụng: ${escapeHtml(err.message)}</div>`;
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
